<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none" role="img" aria-label="The PaChat command palette, showing channel, member and full-text message results">
  <defs>
    <linearGradient id="markP" x1="2" y1="2" x2="18" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818CF8"/><stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="ambientP" cx="0" cy="0" r="1" gradientTransform="translate(720 140) rotate(60) scale(620 500)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1" stop-opacity="0.16"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="winP"><rect width="1440" height="900" rx="12"/></clipPath>

    <style>
      .f { font-family: Inter, 'Segoe UI', system-ui, sans-serif; }
      .m { font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .ink   { fill: #E9EBF2; }
      .muted { fill: #A3A9BB; }
      .dim   { fill: #6C7384; }
      .faint { fill: #4A505F; }
      .b600 { font-weight: 600; } .b500 { font-weight: 500; }
      .up { letter-spacing: 0.7px; text-transform: uppercase; }
      .e { font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', 'Segoe UI Symbol', sans-serif; }
      /* Matched search terms. Rendered as an inline tspan so it always flows
         with the surrounding text — a positioned background rect would drift
         the moment any neighbouring glyph changed width. */
      .hl {
        fill: #FBBF24;
        font-weight: 600;
        text-decoration: underline;
        text-decoration-color: rgba(251, 191, 36, 0.45);
        text-underline-offset: 2px;
      }
    </style>
  </defs>

  <g clip-path="url(#winP)">
    <!-- ── Dimmed application behind the scrim ─────────────────────────── -->
    <rect width="1440" height="900" fill="#0B0C10"/>
    <rect width="1440" height="900" fill="url(#ambientP)"/>

    <g opacity="0.3">
      <rect width="1440" height="44" fill="#0B0C10"/>
      <line x1="0" y1="44" x2="1440" y2="44" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <g transform="translate(14 13)">
        <path d="M10 1.5c4.5 0 7.8 2.9 7.8 6.7S14.5 14.9 10 14.9c-.8 0-1.6-.1-2.4-.2l-3.2 1.9a.6.6 0 0 1-.85-.54l.25-2.83C2.25 11.9 2.2 10 2.2 8.2 2.2 4.4 5.5 1.5 10 1.5Z" fill="url(#markP)"/>
      </g>
      <text class="f b600 ink" x="42" y="27" font-size="12.5">PaChat</text>

      <rect y="44" width="288" height="856" fill="#07080C" fill-opacity="0.55"/>
      <line x1="288" y1="44" x2="288" y2="900" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <g transform="translate(28 100)" fill="#1D212C">
        <rect width="200" height="12" rx="6"/>
        <rect y="40" width="168" height="12" rx="6"/>
        <rect y="80" width="184" height="12" rx="6"/>
        <rect y="150" width="140" height="12" rx="6"/>
        <rect y="190" width="176" height="12" rx="6"/>
      </g>
      <g transform="translate(336 170)" fill="#1D212C">
        <circle cx="16" cy="16" r="16"/>
        <rect x="44" y="4" width="120" height="11" rx="5.5"/>
        <rect x="44" y="24" width="520" height="11" rx="5.5"/>
        <rect x="44" y="44" width="420" height="11" rx="5.5"/>
        <circle cx="16" cy="126" r="16"/>
        <rect x="44" y="114" width="100" height="11" rx="5.5"/>
        <rect x="44" y="134" width="580" height="11" rx="5.5"/>
        <circle cx="16" cy="236" r="16"/>
        <rect x="44" y="224" width="130" height="11" rx="5.5"/>
        <rect x="44" y="244" width="460" height="11" rx="5.5"/>
      </g>
      <rect x="1176" y="44" width="264" height="856" fill="#07080C" fill-opacity="0.4"/>
      <line x1="1176" y1="44" x2="1176" y2="900" stroke="#FFFFFF" stroke-opacity="0.06"/>
    </g>

    <!-- Scrim -->
    <rect width="1440" height="900" fill="#000000" fill-opacity="0.55"/>

    <!-- ── Palette ─────────────────────────────────────────────────────── -->
    <g transform="translate(336 190)">
      <rect width="768" height="462" rx="20" fill="#171A23" fill-opacity="0.97" stroke="#FFFFFF" stroke-opacity="0.12"/>

      <!-- Query row -->
      <g transform="translate(20 24)" stroke="#6C7384" stroke-width="1.5" fill="none">
        <circle cx="6" cy="6" r="5.2"/><path d="M9.9 9.9 13.5 13.5" stroke-linecap="round"/>
      </g>
      <text class="f ink" x="48" y="36" font-size="14.5">pagination</text>
      <rect x="131" y="20" width="1.5" height="19" fill="#818CF8"/>
      <g transform="translate(712 22)">
        <rect width="36" height="18" rx="4" fill="#07080C" stroke="#FFFFFF" stroke-opacity="0.18"/>
        <text class="f b600 dim" x="18" y="13" font-size="10" text-anchor="middle">Esc</text>
      </g>
      <line x1="0" y1="60" x2="768" y2="60" stroke="#FFFFFF" stroke-opacity="0.07"/>

      <!-- ── Results ───────────────────────────────────────────────────── -->

      <!-- 1 · channel hit (selected) -->
      <g transform="translate(10 72)">
        <rect width="748" height="44" rx="10" fill="#6366F1" fill-opacity="0.16"/>
        <rect x="14" y="8" width="28" height="28" rx="7" fill="#1D212C"/>
        <text class="e" x="28" y="28" font-size="14" text-anchor="middle" fill="#E9EBF2">⚙️</text>
        <text class="f b500 ink" x="54" y="20" font-size="13.5">#engineering</text>
        <text class="f faint" x="54" y="34" font-size="11.5">Architecture, reviews, incidents</text>
      </g>

      <!-- 2 · member hit -->
      <g transform="translate(10 120)">
        <circle cx="28" cy="22" r="12" fill="#818CF8"/>
        <text class="f b600" x="28" y="26" font-size="10" fill="#0D1033" text-anchor="middle">AL</text>
        <circle cx="37" cy="31" r="4" fill="#171A23"/><circle cx="37" cy="31" r="2.6" fill="#34D399"/>
        <text class="f b500 ink" x="54" y="20" font-size="13.5">Ada Lovelace</text>
        <text class="f faint" x="54" y="34" font-size="11.5">@ada</text>
        <g transform="translate(716 15)" stroke="#4A505F" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1h12v9H6l-3 3V10H1z"/>
        </g>
      </g>

      <!-- Section label -->
      <text class="f b600 faint up" x="24" y="186" font-size="10">Messages · 4 matched</text>

      <!-- 3–6 · full-text hits. The matched term is an inline tspan, so it
           can never drift out of alignment with the sentence around it. -->
      <g transform="translate(10 196)">
        <text class="f b500 muted" x="54" y="16" font-size="12">Ada Lovelace</text>
        <text class="f faint" x="146" y="16" font-size="11">in #engineering · 4d</text>
        <text class="f dim" x="54" y="34" font-size="12.5">Decision: keyset <tspan class="hl">pagination</tspan> on message ids instead of offset. Ids are…</text>
      </g>

      <g transform="translate(10 244)">
        <text class="f b500 muted" x="54" y="16" font-size="12">Linus Torvalds</text>
        <text class="f faint" x="150" y="16" font-size="11">in #engineering · 4d</text>
        <text class="f dim" x="54" y="34" font-size="12.5">Agreed. Offset <tspan class="hl">pagination</tspan> on a live feed shifts under you the moment…</text>
      </g>

      <g transform="translate(10 292)">
        <text class="f b500 muted" x="54" y="16" font-size="12">Alan Turing</text>
        <text class="f faint" x="134" y="16" font-size="11">in #engineering · 1d</text>
        <text class="f dim" x="54" y="34" font-size="12.5">The FTS5 index pairs well with keyset <tspan class="hl">pagination</tspan> — both ride the…</text>
      </g>

      <g transform="translate(10 340)">
        <text class="f b500 muted" x="54" y="16" font-size="12">Grace Hopper</text>
        <text class="f faint" x="146" y="16" font-size="11">in direct message · 5h</text>
        <text class="f dim" x="54" y="34" font-size="12.5">Can you explain the <tspan class="hl">pagination</tspan> cursor on Thursday? I want to…</text>
      </g>

      <!-- Footer -->
      <line x1="0" y1="404" x2="768" y2="404" stroke="#FFFFFF" stroke-opacity="0.07"/>
      <g transform="translate(24 418)">
        <rect width="18" height="16" rx="3.5" fill="#07080C" stroke="#FFFFFF" stroke-opacity="0.18"/>
        <text class="f b600 dim" x="9" y="11.5" font-size="9.5" text-anchor="middle">↑</text>
        <rect x="22" width="18" height="16" rx="3.5" fill="#07080C" stroke="#FFFFFF" stroke-opacity="0.18"/>
        <text class="f b600 dim" x="31" y="11.5" font-size="9.5" text-anchor="middle">↓</text>
        <text class="f faint" x="48" y="12" font-size="11">navigate</text>

        <rect x="116" width="18" height="16" rx="3.5" fill="#07080C" stroke="#FFFFFF" stroke-opacity="0.18"/>
        <text class="f b600 dim" x="125" y="11.5" font-size="9.5" text-anchor="middle">↵</text>
        <text class="f faint" x="142" y="12" font-size="11">open</text>

        <text class="f faint" x="720" y="12" font-size="11" text-anchor="end">BM25 ranked · SQLite FTS5</text>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="1439" height="899" rx="12" stroke="#FFFFFF" stroke-opacity="0.09" fill="none"/>
  </g>
</svg>
